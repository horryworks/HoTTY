<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blackhole" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" /> <!-- Bright white center -->
      <stop offset="20%" style="stop-color:#00ffff;stop-opacity:1" /> <!-- Cyan glow -->
      <stop offset="60%" style="stop-color:#1a0b2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background to make contrast pop -->
  <rect width="512" height="512" fill="#050010" rx="100" ry="100" />

  <!-- Black Hole Accretion Disk (Vibrant Neon) -->
  <ellipse cx="256" cy="256" rx="220" ry="80" fill="none" stroke="#00ffff" stroke-width="20" opacity="0.8" filter="url(#glow)" transform="rotate(-15, 256, 256)" />
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#ff00ff" stroke-width="15" opacity="0.6" filter="url(#glow)" transform="rotate(10, 256, 256)" />

  <!-- Black Hole Core -->
  <circle cx="256" cy="256" r="100" fill="url(#blackhole)" filter="url(#glow)" />
  
  <!-- Terminal Window (Brighter border and background) -->
  <rect x="100" y="160" width="312" height="232" rx="12" ry="12" fill="#121212" stroke="#00ffff" stroke-width="6" filter="url(#glow)" />
  
  <!-- Terminal Header -->
  <rect x="100" y="160" width="312" height="35" rx="12" ry="12" fill="#222" />
  <rect x="100" y="185" width="312" height="10" fill="#222" /> <!-- Cover bottom header radius -->
  
  <!-- Terminal Buttons (Brighter) -->
  <circle cx="125" cy="177" r="7" fill="#ff5f56" />
  <circle cx="150" cy="177" r="7" fill="#ffbd2e" />
  <circle cx="175" cy="177" r="7" fill="#27c93f" />

  <!-- Terminal Content (Vibrant Green) -->
  <text x="120" y="230" font-family="Arial, monospace" font-size="28" fill="#00ff00" font-weight="bold">$ hterm</text>
  <text x="120" y="280" font-family="Arial, monospace" font-size="20" fill="#fff" opacity="0.9">READY_</text>
  
  <!-- Pulsing Cursor -->
  <rect x="120" y="300" width="20" height="4" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
  </rect>

</svg>
