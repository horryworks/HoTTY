<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blackhole" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a0b2e;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#4b0082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Black Hole Background -->
  <circle cx="256" cy="256" r="240" fill="url(#blackhole)" />
  
  <!-- Accretion Disk (Swirl effect simulation) -->
  <path d="M 100 256 Q 256 100 412 256 Q 256 412 100 256" fill="none" stroke="#8a2be2" stroke-width="15" opacity="0.6" filter="url(#glow)" transform="rotate(45, 256, 256)" />
  <path d="M 120 256 Q 256 120 392 256 Q 256 392 120 256" fill="none" stroke="#4b0082" stroke-width="10" opacity="0.4" transform="rotate(-30, 256, 256)" />

  <!-- Terminal Window (Large, Square, extending slightly) -->
  <rect x="100" y="140" width="312" height="232" rx="10" ry="10" fill="#1e1e1e" stroke="#333" stroke-width="4" />
  
  <!-- Terminal Header -->
  <rect x="100" y="140" width="312" height="30" rx="10" ry="10" fill="#333" />
  <rect x="100" y="160" width="312" height="10" fill="#333" /> <!-- Cover bottom header radius -->
  
  <!-- Terminal Buttons -->
  <circle cx="120" cy="155" r="5" fill="#ff5f56" />
  <circle cx="140" cy="155" r="5" fill="#ffbd2e" />
  <circle cx="160" cy="155" r="5" fill="#27c93f" />

  <!-- Terminal Content -->
  <text x="120" y="200" font-family="monospace" font-size="24" fill="#0f0" font-weight="bold">$ hterm start</text>
  <text x="120" y="240" font-family="monospace" font-size="18" fill="#ccc">Connecting...</text>
  <text x="120" y="270" font-family="monospace" font-size="18" fill="#ccc">Session established.</text>
  <rect x="120" y="290" width="15" height="24" fill="#0f0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

</svg>
