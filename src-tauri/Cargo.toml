[package]
name = "hotty"
version = "2.0.16"
description = "HoTTY - AI Integrated Advanced Terminal Emulator (Rust/Tauri)"
authors = ["horryworks"]
license = "GPL-3.0-or-later"
repository = "https://github.com/horryworks/HoTTY"
edition = "2021"
# Floor raised from 1.77.2 for `snmp2` (edition 2024, MSRV 1.90.0). The pinned
# toolchain in rust-toolchain.toml (1.95.0) is well above this; this field just
# records the real floor so it doesn't drift from what the tree can build.
rust-version = "1.90.0"

[lib]
name = "app_lib"
# Windows desktop only (`bundle.targets = ["nsis"]`). The bin target in
# src/main.rs links this as an rlib, and tests/ai_streaming.rs does too; nothing
# consumes the other two crate types.
#
# `staticlib`/`cdylib` are the Tauri MOBILE template's defaults — Xcode links the
# staticlib for iOS, Android's JNI loader dlopen()s the cdylib — and the mobile
# entry point in lib.rs is cfg-gated (`#[cfg_attr(mobile, tauri::mobile_entry_point)]`),
# a cfg that is never set for x86_64-pc-windows-msvc. Building them costs a
# 183 MB app_lib.lib and a 1.7 MB app_lib.dll on every release build, and with
# `lto = "fat"` below cargo would run whole-program LTO over all three outputs
# instead of one. Restore them if a mobile target is ever added.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
# `embedded-webview` enables tauri's multiwebview (`Window::add_child` /
# `WebviewBuilder`) used by the Web Browser pane to embed a native WebView2 child
# at a pane's rectangle.
#
# It is intentionally NON-DEFAULT. Tauri's `unstable` linkage makes the bare
# `cargo test` harness binary fail to LOAD on Windows with 0xC0000139
# (STATUS_ENTRYPOINT_NOT_FOUND) — the test exe lacks the application manifest
# that `tauri-build` embeds in the real app binary (which resolves the comctl32
# v6 imports the unstable webview code pulls in). The shipped app enables this
# feature via the tauri build (`tauri build --features embedded-webview`, wired
# in package.json), so the app works; keeping it off the default set lets
# `cargo test` / `cargo check` / `cargo clippy` run unmodified.
#
# NOTE: the `unstable` API may change across tauri minor/patch releases — the
# crate is version-pinned; re-verify `add_child`/`WebviewBuilder` on every bump.
# To check the gated code: `cargo clippy --features embedded-webview`.
embedded-webview = ["tauri/unstable"]

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Ensures only one HoTTY process runs; a second launch forwards to the existing
# process (callback opens a new window instead of starting a second instance).
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }

# Logging
log = "0.4"

# PTY (Local/WSL terminals)
portable-pty = "0.8"

# SSH
# Enable optional legacy algorithm features that the user can opt into via Settings:
#   - "des" enables 3des-cbc (older Cisco IOS, etc.)
#   - "dsa" enables ssh-dss host keys
russh = { version = "0.60", features = ["des", "dsa"] }

# SFTP subsystem (server + client) layered on top of russh's SSH transport.
# Transport-agnostic — operates on any AsyncRead+AsyncWrite stream, so it is not
# version-coupled to russh. Powers the built-in SFTP server (File Server feature).
russh-sftp = "2.1"

# Serial Port
serialport = "4.7"

# Networking
reqwest = { version = "0.12", features = ["json", "stream"] }

# TFTP server (RFC 1350 + option negotiation) for the File Server feature —
# lets network devices (e.g. Cisco) pull/push firmware images over UDP.
# Executor-agnostic (async-io reactor); runs inside the existing tokio app.
async-tftp = "0.4.2"

# SNMP v2c/v3 client for the Interface Traffic Watcher pane (ifTable/ifXTable
# polling over UDP/161). Feature set is deliberately minimal:
#   - "tokio"       async sessions on the existing runtime (AsyncSession)
#   - "v3"          USM (noAuthNoPriv / authNoPriv / authPriv)
#   - "crypto-rust" pure-Rust MD5/SHA/AES/DES — the RustCrypto crates it needs
#                   are already in the tree via russh, so the lock delta is small
#   - "heap_buffers" moves the two 65_507-byte scratch buffers (send + recv) off
#                   the struct and onto the heap. Without it `AsyncSession` is a
#                   ~131 KB by-value struct that gets memcpy'd out of its
#                   constructor — exactly the kind of resident cost this project
#                   exists to avoid.
# `mibs` is OFF (it links native libnetsnmp) and `crypto-openssl` is OFF (would
# drag in an OpenSSL build); default-features would enable crypto-rust anyway but
# is disabled so the set stays explicit.
snmp2 = { version = "0.5.2", default-features = false, features = ["tokio", "v3", "crypto-rust", "heap_buffers"] }

# Off-thread file I/O adapter (futures AsyncRead/AsyncWrite over std::fs::File);
# required to serve files through async-tftp's Handler trait. Already in the tree
# transitively via async-tftp.
blocking = "1.6"

# Cryptography
aes-gcm = "0.10"
# Argon2id KDF for v2 .htree exports (memory-hard); PBKDF2 retained for reading
# legacy v1 .htree files only.
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
# rand 0.10 (already in the tree via russh) exposes an OsRng whose rand_core
# major matches ssh-key's RSA keygen; used only for the SFTP RSA host key.
rand_v010 = { package = "rand", version = "0.10" }
base64 = "0.22"

# Windows APIs (DPAPI, credential encryption)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# WebView2 COM access for the Web Browser pane (enable password autosave /
# autofill). Versions MUST match what wry/tauri pull (see Cargo.lock):
# webview2-com 0.38.2 → windows-core 0.61.2. Used only by the feature-gated
# `embedded-webview` code; already present transitively via tauri (no lock delta).
webview2-com = "0.38"
windows-core = "0.61"

# Error handling
thiserror = "2"

# Character encoding
encoding_rs = "0.8"

# Async trait
async-trait = "0.1"

# Futures utilities
futures = "0.3"

# Cancellation tokens for async tasks
tokio-util = { version = "0.7", features = ["rt"] }

# JWT creation for Vertex AI service account authentication (RS256 over a PEM
# service-account key).
#
# v10 replaced v9's hard `ring` dependency with a selectable crypto backend.
# jsonwebtoken was `ring`'s only consumer in the BUILD graph, and `aws-lc-rs` is
# already compiled here via russh 0.60 — so selecting `aws_lc_rs` drops a whole
# second C/assembly crypto stack for zero new native build requirements.
# Verify with `cargo tree -e all -i ring --target all` (expect "nothing to
# print"), NOT by grepping Cargo.lock: the lock is resolved without features, so
# it still lists ring under rustls-webpki's optional `ring` feature, which is
# off. deny.toml bans the crate outright so a silent return fails CI.
#
# Pinned to "10" rather than "11" on purpose. 11.0.0 was published 2026-07-24 —
# note that jsonwebtoken was NOT on renovate.json's 14-day crypto list at that
# point (only the global 7-day soak reached it); it was added to that list in
# this release, so the cooldown appealed to here now genuinely exists. Either
# way 11.x is merely *eligible*, not soaked, while 10.4.0 has ~3 months in the
# field on the auth path. Treat the 11.x bump as a deliberate, separately
# verified change — re-check that the backend still resolves to aws_lc_rs, since
# the feature set is precisely what moved between 9 and 10.
#
# `use_pem` is part of `default` and stays on — EncodingKey::from_rsa_pem needs it.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

# Lightweight regex (no proc-macro, used for validation)
regex-lite = "0.1"

# Secure memory wiping for sensitive data (passwords, passphrases)
zeroize = "1"

[dev-dependencies]
# Integration tests for the shared SSE stream drivers (tests/ai_streaming.rs)
# feed synthetic byte streams to the same loops production uses — no live HTTP.
# All already resolved as normal/transitive deps, so `--locked` sees no delta.
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# ---------------------------------------------------------------------------
# Release profile.
#
# There is no workspace root Cargo.toml, so this crate's profile is the one that
# governs the shipped binary. Cargo's defaults (thin-LOCAL LTO, 16 codegen
# units) leave a lot on the table for a binary that links ~800 crates: with 16
# CGUs the optimizer never sees across unit boundaries, so generic
# instantiations and small cross-crate calls are duplicated instead of merged.
#
# Baseline before this block: hotty.exe = 25.39 MiB (.text 17.63, .rdata 6.68,
# .pdata 1.00), NSIS installer = 6.37 MiB.
# ---------------------------------------------------------------------------
[profile.release]
# cargo default. This app is latency-sensitive (PTY read loop, SSH transport,
# SNMP polling, SSE stream drivers) — "s"/"z" would trade measurable throughput
# for a few hundred KB, which is the wrong side of the trade here.
opt-level = 3

# Whole-program LTO across every crate in the graph, and a single final codegen
# unit so nothing is duplicated across units. This pair is the actual size win.
# If the link ever OOMs or gets intolerable, `lto = "thin"` retains ~75-85% of
# the reduction at a fraction of the cost.
lto = "fat"
codegen-units = 1

# NOTE — measured on *-pc-windows-msvc, not assumed: this is NOT a size win.
# Release already has `debug = false`, and MSVC keeps debug info out of band in
# hotty.pdb. The PE's debug directory holds only an 84-byte table plus a 34-byte
# CodeView record naming "hotty.pdb", a 20-byte VC-Feature record and a
# 1084-byte POGO record — ~1.2 KB out of 25.39 MiB (0.005%).
# What `strip` actually does here is suppress PDB generation, dropping the
# 10.6 MB local hotty.pdb and shortening the link. The cost is that crash
# reports / minidumps can no longer be symbolized. Set `strip = "none"` if
# symbolized crashes matter more — the SHIPPED artifact is the same size either way.
strip = true

# cargo default, stated explicitly so it is never silently flipped. `abort`
# would shrink .text further by dropping the 1.00 MB .pdata unwind tables, but
# it changes crash semantics for the SSH/PTY task tree: tokio tasks that
# currently unwind and are joined would take the whole process down instead.
panic = "unwind"

# All cargo defaults; listed so the profile is self-documenting.
debug = false
incremental = false
overflow-checks = false

# Deliberately NOT set:
#   split-debuginfo — MSVC only supports "packed" (a PDB); setting it is inert.
#   [profile.release.package."*"] opt-level = "s" — under fat LTO the final
#     codegen uses THIS profile's settings, so a per-package opt-level only
#     affects the pre-LTO pass. Unpredictable payoff; skipped.
