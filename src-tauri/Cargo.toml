[package]
name = "hotty"
version = "0.1.1"
description = "HoTTY - AI Integrated Advanced Terminal Emulator (Rust/Tauri)"
authors = ["horryworks"]
license = "GPL-3.0-or-later"
repository = "https://github.com/horryworks/HoTTY-Rust-Tauri"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"

# PTY (Local/WSL terminals)
portable-pty = "0.8"

# SSH
russh = "0.60"

# Serial Port
serialport = "4.7"

# Networking
reqwest = { version = "0.12", features = ["json", "stream"] }

# Cryptography
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Windows APIs (DPAPI, credential encryption)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_Foundation",
] }

# Error handling
thiserror = "2"
anyhow = "1"

# Character encoding
encoding_rs = "0.8"

# Async trait
async-trait = "0.1"

# Futures utilities
futures = "0.3"
