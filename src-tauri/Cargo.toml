[package]
name = "hotty"
version = "2.0.6"
description = "HoTTY - AI Integrated Advanced Terminal Emulator (Rust/Tauri)"
authors = ["horryworks"]
license = "GPL-3.0-or-later"
repository = "https://github.com/horryworks/HoTTY"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }

# Logging
log = "0.4"

# PTY (Local/WSL terminals)
portable-pty = "0.8"

# SSH
# Enable optional legacy algorithm features that the user can opt into via Settings:
#   - "des" enables 3des-cbc (older Cisco IOS, etc.)
#   - "dsa" enables ssh-dss host keys
russh = { version = "0.60", features = ["des", "dsa"] }

# Serial Port
serialport = "4.7"

# Networking
reqwest = { version = "0.12", features = ["json", "stream"] }

# Cryptography
aes-gcm = "0.10"
# Argon2id KDF for v2 .htree exports (memory-hard); PBKDF2 retained for reading
# legacy v1 .htree files only.
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Windows APIs (DPAPI, credential encryption)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Memory",
] }

# Error handling
thiserror = "2"
anyhow = "1"

# Character encoding
encoding_rs = "0.8"

# Async trait
async-trait = "0.1"

# Futures utilities
futures = "0.3"

# Cancellation tokens for async tasks
tokio-util = { version = "0.7", features = ["rt"] }

# JWT creation for Vertex AI service account authentication
jsonwebtoken = "9"

# Lightweight regex (no proc-macro, used for validation)
regex-lite = "0.1"

# Secure memory wiping for sensitive data (passwords, passphrases)
zeroize = "1"
