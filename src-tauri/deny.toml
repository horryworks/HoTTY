# cargo-deny: supply-chain policy for the Rust dependency tree.
# Run inside src-tauri/:  cargo deny check advisories bans sources licenses
# Install once:           cargo install cargo-deny --locked

[graph]
all-features = true # scan russh des/dsa and other legacy-crypto feature paths too

[advisories]
version = 2
# "warn" not "deny": russh 0.60.3 transitively pins RC crypto crates that pull a
# yanked `aes 0.9.0`. We can't move off it without russh changing, and project
# policy already treats `yanked` as below the release-blocking threshold (see
# .claude/commands/verify.md). Real RUSTSEC vulnerability advisories still fail.
yanked = "warn"
# Only flag `unmaintained` advisories for crates HoTTY depends on DIRECTLY. The
# transitive ones (gtk-rs GTK3 bindings via Tauri's Linux stack, fxhash, …) are
# forced by upstream and are "unmaintained", not vulnerabilities — project policy
# already treats `unmaintained` as below the release-blocking threshold.
unmaintained = "workspace"
# Reviewed-and-accepted advisories go here as "RUSTSEC-XXXX-YYYY" with a
# comment giving the reason and the date of review (the human Medium+ triage).
ignore = [
  # rsa "Marvin Attack" timing sidechannel. No fixed `rsa` release exists; the
  # crate is required transitively by russh for SSH RSA host/key support, so it
  # cannot be removed. Known, accepted, unfixable. Reviewed 2026-06-23.
  "RUSTSEC-2023-0071",
  # `rand` unsound only when a custom global logger calls `rand::rng()` — not a
  # code path HoTTY uses. `unsound` is below the release-blocking threshold per
  # project policy (see .claude/commands/verify.md). Reviewed 2026-06-23.
  "RUSTSEC-2026-0097",
]

[bans]
multiple-versions = "warn" # solo project: surface duplicate versions, don't block
wildcards = "deny"         # no wildcard ("*") version requirements
deny = []                  # add a crate here to ban it outright

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git deps today. With allow-git unset, ANY future git dependency is a hard
# error — the guard against a crate being swapped to a malicious fork.

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",            # Boost Software License (permissive) — e.g. error-code
  "GPL-3.0-or-later",   # HoTTY's own crate license
]
confidence-threshold = 0.9
# Per-crate license exceptions (added after the first `check licenses` run):
# exceptions = [ { name = "ring", allow = ["OpenSSL"] } ]
