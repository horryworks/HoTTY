name: Bug report / バグ報告
description: Report a problem with HoTTY / 不具合を報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the details needed to reproduce.
        ご報告ありがとうございます。再現に必要な情報を埋めてください。

  - type: input
    id: version
    attributes:
      label: HoTTY version
      description: See Help → About / Help → About、またはタイトルバーで確認できます
      placeholder: v2.0.6
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - Other / その他
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Connection type / 接続方式
      description: If relevant / 該当する場合
      options:
        - N/A / 該当なし
        - SSH
        - Telnet
        - Serial
        - WSL
        - Local shell / ローカルシェル
        - GCP IAP
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 実際の動作
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / ログ・スクリーンショット
      description: Paste logs or error messages if available / Log Viewer のログやエラーメッセージがあれば貼り付けてください
      render: text
    validations:
      required: false
