name: 機能要望 / Feature request
description: 新機能や改善を提案する / Suggest a feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / Problem
      description: どんな作業や状況で困っていますか / What workflow or situation is this for?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策 / Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・その他 / Alternatives or context
    validations:
      required: false
