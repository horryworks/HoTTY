name: Feature request / 機能要望
description: Suggest a feature or improvement / 新機能や改善を提案する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 解決したい課題
      description: What workflow or situation is this for? / どんな作業や状況で困っていますか
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 提案する解決策
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or context / 代替案・その他
    validations:
      required: false
