# Supply-chain audit gate. Runs on every push/PR to v2 and weekly (to catch
# new advisories on unchanged deps). Third-party actions are SHA-pinned.
# NOTE: deliberately NO `cargo build` here — the Rust tree has cfg(windows)
# deps (windows crate, DPAPI) that don't compile on ubuntu. cargo-deny only
# resolves the dependency graph + RustSec DB, so it runs fine on Linux.
name: security-audit

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          # This job only audits — never restore deps from a cache. setup-node v5+
          # auto-enables npm caching once package.json gains a `packageManager`
          # field; keep the audit path reading the lockfile only.
          package-manager-cache: false
      # --ignore-scripts is safe HERE because this job only audits, never builds.
      # (A local build must use plain `npm ci` — --ignore-scripts drops lightningcss's
      # native binary. See .npmrc.)
      - run: npm ci --ignore-scripts
      # The advisory gate is `audit:deps`, NOT `npm audit`. The registry's bulk
      # endpoint intermittently returns a gzip body without `Content-Encoding`,
      # which makes `npm audit` die on a JSON parse error unrelated to this repo;
      # the script retries and decompresses defensively. It also applies
      # audit-ignore.json (reviewed-and-accepted, expiry-enforced) and exits 2 —
      # not 0 — when the audit cannot run, so a network fault can never pass as clean.
      - run: npm run audit:deps
      - run: npm audit signatures

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: EmbarkStudios/cargo-deny-action@8a45e1c7c9a95dfae3276e89a553705e40ae45a2 # v2.0.20
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans sources licenses
